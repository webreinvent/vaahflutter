name: vaahflutter
description: VaahFlutter, essentials for every flutter app.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  # Annotations
  json_annotation: ^4.9.0
  json_serializable: ^6.9.0
  copy_with_extension: ^6.0.0
  # Console
  colorize: ^3.0.0
  # Log and Performance
  sentry_flutter: ^9.0.0
  datadog_flutter_plugin: ^3.6.0
  datadog_tracking_http_client: ^3.3.0
  # State Management
  get: ^4.6.6
  # Api
  dio: ^5.8.0
  # Utilities
  intl: ^0.20.2
  fluttertoast: 10.0.0
  file_picker: ^13.0.0
  # Firebase
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  # Notifications
  onesignal_flutter: ^5.2.6
  flutter_local_notifications: ^22.3.1
  vs_pusher_channels_flutter: ^2.9.0
  timezone: ^0.11.1
  # Storage
  get_storage: ^2.1.1
  # Icons
  cupertino_icons: ^2.0.0
  font_awesome_flutter: ^11.0.0
  # Deep Link
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  copy_with_extension_gen: ^6.0.0

flutter:
  # below line allows you use Material Icons in application
  uses-material-design: true
  assets:
    - assets/env/

org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M
# Cap the Kotlin daemon heap so the Gradle + Kotlin daemons together stay within
# a modest RAM budget during the jetifier/dex transforms.
kotlin.daemon.jvmargs=-Xmx1024M
android.useAndroidX=true
android.enableJetifier=true
# Enable Flutter's built-in Kotlin (AGP 9 native Kotlin support): the app's own
# Kotlin is compiled by AGP's built-in support instead of a separately applied
# Kotlin Gradle Plugin. Note: the build may still print a "plugins that apply
# KGP" warning for sentry_flutter / firebase_core — that is a static-detection
# false positive (both guard their KGP apply behind AGP<9 / !builtInKotlin), so
# the build stays green.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
kotlin.incremental=false
kotlin.incremental.java=false